app-id: org.triliumnotes.Trilium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  # Provides node on PATH at build time only; nothing of it ships in the app.
  - org.freedesktop.Sdk.Extension.node24
command: trilium
# Electron carries its own locale files
separate-locales: false

finish-args:
  # Wayland first, X11 only where Wayland is unavailable.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for the Chromium renderer.
  - --device=dri
  # Audio playback (attached media, notification sounds).
  - --socket=pulseaudio
  # Sync with self-hosted servers and fetching remote content in notes.
  - --share=network
  # Allow drag & drop from common dirs. Otherwise drag to import would fail due
  # to unreachable files. See https://github.com/electron/electron/issues/30650
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  # Tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: trilium
    buildsystem: simple
    build-options:
      # pnpm first because apps/desktop/scripts/build.ts needs `pnpm build`.
      append-path: /run/build/trilium/flatpak-node/pnpm:/usr/lib/sdk/node24/bin
      env:
        XDG_CACHE_HOME: /run/build/trilium/flatpak-node/cache
    build-commands:
      - pnpm install --offline --frozen-lockfile --reporter=append-only

      - pnpm chore:update-build-info --from-commit
      - pnpm desktop:build

      - install -d /app/lib/trilium
      - cp -a apps/desktop/dist/. /app/lib/trilium/

      # Electron downloads its binary lazily on first use, which an offline sandbox cannot allow.
      # Unpack the cached zip instead.
      - unzip -q flatpak-node/cache/electron/electron-v*-linux-*.zip -d /app/lib/electron
      - mv /app/lib/electron/electron /app/lib/electron/trilium
      - rm /app/lib/electron/chrome-sandbox

      - pnpm exec tsx apps/desktop/electron-forge/flip-fuses.ts /app/lib/electron/trilium
      - pnpm exec tsx apps/desktop/electron-forge/trim-locales.ts /app/lib/electron/locales

      - install -Dm755 trilium.sh /app/bin/trilium
      - for s in 128 256 512; do install -Dm644 "apps/desktop/electron-forge/app-icon/png/${s}x${s}.png"
        "/app/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png"; done
    sources:
      - type: git
        url: https://github.com/TriliumNext/Trilium.git
        tag: v0.105.0
        commit: a0908a6e1e1741a3c3824d803da07300183dcb0c
      - generated-sources.json
      # pnpm 12 ships as a native binary per platform; the wrapper package's
      # postinstall, which an offline sandbox cannot run, is what would pick one.
      - type: archive
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.4.2.tgz
        sha256: 545b89d5c6026ac33d4c28bd3c6cc38cc050d571b35a4e69f13aad4a441af142
        dest: flatpak-node/pnpm
        only-arches: [x86_64]
      - type: archive
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.4.2.tgz
        sha256: c3bb8caba00f308733b0876d245e1e1f3ad656e6605f4f85dd861457267ae9f2
        dest: flatpak-node/pnpm
        only-arches: [aarch64]
      - type: file
        path: trilium.sh

  # Separate module so a metadata edit does not invalidate app build.
  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: org.triliumnotes.Trilium.desktop
      - type: file
        path: org.triliumnotes.Trilium.metainfo.xml
